# Chirper behind nginx for cubemaid.xyz
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cubemaid.xyz
#   sudo ln -s /etc/nginx/sites-available/cubemaid.xyz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then, for HTTPS (recommended, it rewrites this file for you):
#   sudo certbot --nginx -d cubemaid.xyz

server {
    listen 80;
    listen [::]:80;
    server_name cubemaid.xyz;

    # room for image uploads
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # these two are what make the live sync work
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # keep idle websockets alive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
